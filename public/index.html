// =====================================================================
//  Inspector link flow — runs in any phone browser, no app or login
// =====================================================================
const Inspector = {
  active: false, rec: null, step: -1, errors: [], gpsState: 'wait', watch: null, startedAt: null,

  async open(token) {
    this.active = true;
    const rec = Object.values(DB.insp).find(r => r.token === token);
    if (!rec) return this.shell(`<h1>Link not found</h1><p class="sub">This inspection link is invalid or has been replaced by a newer one. Please use the latest link Capitalflow sent you.</p>`, null);
    this.rec = JSON.parse(JSON.stringify(rec));
    this.steps = buildSteps(this.rec);
    if (rec.status === 'cancelled') return this.shell(`<h1>Request cancelled</h1><p class="sub">Capitalflow has cancelled this inspection request. No further action is needed.</p>`, null);
    if (rec.status === 'completed') return this.renderDone(true);
    if (rec.status === 'sent') {
      await mutate(rec.id, x => { x.status = 'opened'; x.events.push({ t: Date.now(), by: 'Inspector', text: 'Link opened' }); }, true);
      this.rec.status = 'opened';
    }
    // pick up where they left off
    if (rec.status === 'in_progress') { this.step = rec.step || 0; this.startGps(); this.startedAt = rec.startedAt; return this.renderStep(); }
    this.renderWelcome();
  },

  shell(body, foot, progress) {
    const total = this.steps ? this.steps.length + 1 : 1;
    const title = this.step >= 0 && this.steps ? (this.steps[this.step] || { title: 'Review & submit' }).title : 'Asset inspection';
    $('#app').innerHTML = `
      <div class="ins">
        <div class="ins-top">
          <div class="row"><span class="logo-pill"><img src="${LOGO}" alt="Capitalflow"></span>
            ${progress ? `<span class="stepname">Step ${this.step + 1} of ${total}</span>` : `<span class="stepname">Secure inspection link</span>`}</div>
          ${progress ? `<div class="pbar"><i style="width:${Math.round((this.step + 1) / total * 100)}%"></i></div><div class="stepname" style="margin-top:6px;color:#fff;font-weight:600;">${esc(title)}</div>` : ''}
        </div>
        <div class="ins-body">${body}</div>
        ${foot ? `<div class="ins-foot">${foot}</div>` : ''}
      </div>`;
    scrollToY(0);
  },

  renderWelcome() {
    const r = this.rec, cat = CATS[r.category];
    const bolts = BOLTONS.filter(b => (r.boltOns || []).includes(b.key) && b.kinds.includes(cat.kind));
    this.step = -1;
    this.shell(`
      <p class="small muted" style="margin:0 0 4px;">Hi ${esc(r.inspector.name.split(' ')[0])},</p>
      <h1>Capitalflow asset inspection</h1>
      <p class="sub" style="font-size:14px;">${esc(CLIENT)} has asked you to inspect this asset. It takes about 10 minutes, all from this page. There's no app to install and no login.</p>
      <div class="asset-card">
        <b>${esc(assetName(r) || cat.label)}</b>
        <div class="small muted" style="margin-top:3px;">${esc([r.asset.reg, cat.label].filter(Boolean).join(' · '))}</div>
        <div class="small" style="margin-top:8px;">Customer: <b>${esc(r.customer)}</b><br>Ref: <b>${esc(r.proposalRef)}</b> · Request #${r.id}<br>Please complete by <b>${fmtDate(r.dueAt)}</b></div>
      </div>
      <b>Before you start, make sure you're with the asset and have:</b>
      <ul class="need">
        <li><span class="ni">🔑</span><span>Access to the ${cat.noun}, inside and out, and its keys</span></li>
        <li><span class="ni">🔎</span><span>The ${cat.kind === 'vehicle' ? 'VIN / chassis number (usually on the windscreen or door pillar)' : 'serial / PIN plate'}</span></li>
        <li><span class="ni">📄</span><span>The invoice or bill of sale${bolts.length ? ', plus: ' + bolts.map(b => b.name.toLowerCase()).join(', ') : ''}</span></li>
        <li><span class="ni">📍</span><span>Location turned on. Your position is recorded with each photo.</span></li>
      </ul>
      <div class="notice n-info">📷 Photos must be taken live with your camera during this inspection. Each one is stamped with the time and your location.</div>
      <p class="small muted">You can stop and come back to this link at any time. Your progress is saved after each step.</p>`,
      `<button class="btn btn-primary" id="start">Start inspection</button>`);
    $('#start').onclick = async () => {
      $('#start').disabled = true; $('#start').textContent = 'Checking location…';
      this.startGps();
      this.startedAt = Date.now();
      await mutate(r.id, x => {
        x.status = 'in_progress'; x.startedAt = this.startedAt; x.step = 0;
        if (!x.answers.siteAddress) x.answers.siteAddress = x.expectedAddress;
        if (!x.answers.make) Object.assign(x.answers, { make: x.asset.make, model: x.asset.model });
        x.events.push({ t: Date.now(), by: 'Inspector', text: 'Inspection started' });
      }, true).then(x => { this.rec = JSON.parse(JSON.stringify(x)); });
      this.step = 0; this.renderStep();
    };
  },

  startGps() {
    if (this.watch != null) return;
    if (!navigator.geolocation) { this.gpsState = 'bad'; return; }
    this.watch = navigator.geolocation.watchPosition(
      p => { this.gps = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }; this.gpsState = 'ok'; this.syncGpsChip(); },
      () => { this.gpsState = 'bad'; this.syncGpsChip(); },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  },

  gpsChipHtml() {
    if (this.gpsState === 'ok') return `<span class="gps-chip">📍 Location recorded · ±${Math.round(this.gps.acc)} m</span>`;
    if (this.gpsState === 'bad') return `<span class="gps-chip bad">📍 Location blocked — please allow location for this site</span>`;
    return `<span class="gps-chip wait">📍 Getting your location…</span>`;
  },
  syncGpsChip() { const el = $('#gpsChip'); if (el) el.innerHTML = this.gpsChipHtml(); },

  fieldHtml(f) {
    const a = this.rec.answers, v = a[f.key] == null ? '' : a[f.key];
    const err = this.errors.includes(f.key) ? ' err' : '';
    const lab = `<label>${esc(f.label)}${f.req ? ' <span class="req">*</span>' : ''}</label>`;
    const msg = `<div class="qerr">${f.type === 'photo' ? 'Please take this photo' : 'Please answer this question'}</div>`;
    if (f.type === 'yesno' || f.type === 'choice') {
      const opts = f.type === 'yesno' ? ['Yes', 'No'] : f.options;
      return `<div class="q${err}" data-q="${f.key}">${lab}<div class="seg">${opts.map(o => `<button data-pick="${f.key}" data-v="${esc(o)}" class="${v === o ? 'on' : ''}">${esc(o)}</button>`).join('')}</div>${msg}</div>`;
    }
    if (f.type === 'photo') {
      const p = this.rec.photos[f.key];
      return `<div class="q${err}" data-q="${f.key}">${lab}
        <label class="ptile ${p ? 'has' : ''}">${p ? `<img src="${photoSrc(this.rec, p)}" alt=""><span class="tick">✓</span>` : `<span>${ICON.cam}Tap to take photo</span>`}
          <input type="file" accept="image/*" capture="environment" data-photo="${f.key}" hidden></label>
        <div class="prow"><span class="small muted">${p ? '📍 ' + fmtStamp(p.t) : 'Use your rear camera'}</span><button class="linkbtn" data-sample="${f.key}">Use sample photo (demo)</button></div>${msg}</div>`;
    }
    if (f.type === 'textarea') return `<div class="q${err}" data-q="${f.key}">${lab}<textarea class="inp" rows="3" data-in="${f.key}">${esc(v)}</textarea>${msg}</div>`;
    const t = f.type === 'number' ? 'text" inputmode="numeric' : f.type === 'date' ? 'date' : 'text';
    return `<div class="q${err}" data-q="${f.key}">${lab}<input class="inp" type="${t}" data-in="${f.key}" value="${esc(v)}" ${f.upper ? 'style="text-transform:uppercase" autocapitalize="characters"' : ''}>${msg}</div>`;
  },

  renderStep() {
    if (this.step >= this.steps.length) return this.renderReview();
    const s = this.steps[this.step], a = this.rec.answers;
    this.shell(`
      <div id="gpsChip">${this.gpsChipHtml()}</div>
      <h1>${esc(s.title)}</h1>
      ${s.intro ? `<p class="sub" style="margin-bottom:18px;">${esc(s.intro)}</p>` : '<div style="height:14px;"></div>'}
      ${this.gpsState === 'bad' && this.step === 0 ? `<div class="notice n-warn">Capitalflow needs your location to confirm where the asset is. Allow location for this page in your browser settings, then reload. You can carry on, but the report will show that location wasn't shared.</div>` : ''}
      ${s.fields.filter(f => visible(f, a)).map(f => this.fieldHtml(f)).join('')}`,
      `${this.step > 0 ? '<button class="btn btn-outline" id="back">Back</button>' : ''}<button class="btn btn-primary" id="next">Next</button>`, true);

    document.querySelectorAll('[data-in]').forEach(el => el.oninput = () => {
      const f = this.findField(el.dataset.in);
      a[el.dataset.in] = f && f.upper ? el.value.toUpperCase() : el.value; el.closest('.q').classList.remove('err');
    });
    document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
      a[b.dataset.pick] = b.dataset.v; this.errors = this.errors.filter(k => k !== b.dataset.pick); this.renderStepKeepScroll();
    });
    document.querySelectorAll('[data-photo]').forEach(inp => inp.onchange = () => { if (inp.files[0]) this.takePhoto(inp.dataset.photo, inp.files[0]); });
    document.querySelectorAll('[data-sample]').forEach(b => b.onclick = () => this.takeSample(b.dataset.sample));
    if ($('#back')) $('#back').onclick = () => { this.step--; this.errors = []; this.renderStep(); };
    $('#next').onclick = () => this.next();
  },

  renderStepKeepScroll() { const y = scrollY0(); this.renderStep(); scrollToY(y); },

  findField(key) { for (const s of this.steps) for (const f of s.fields) if (f.key === key) return f; },

  stampMeta() {
    return { t: Date.now(), lat: this.gps ? this.gps.lat : null, lon: this.gps ? this.gps.lon : null };
  },

  takeSample(key) {
    const f = this.findField(key), m = this.stampMeta();
    const text = f.sampleText ? f.sampleText(this.rec.answers) : '';
    const src = samplePhoto(f.sample || 'front', this.rec.category, text, m.t, m.lat != null ? { lat: m.lat, lon: m.lon } : null);
    this.rec.photos[key] = { src, ...m, live: true, sample: true };
    this.errors = this.errors.filter(k => k !== key);
    this.renderStepKeepScroll();
  },

  takePhoto(key, file) {
    const m = this.stampMeta();
    // a file created well before this session started came from the gallery, not the camera
    const live = !file.lastModified || file.lastModified >= (this.startedAt || Date.now()) - 2 * 60000;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1100, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
      drawStamp(x, c.width, c.height, m.t, m.lat != null ? { lat: m.lat, lon: m.lon } : null);
      this.rec.photos[key] = { src: c.toDataURL('image/jpeg', .7), ...m, live };
      URL.revokeObjectURL(url);
      this.errors = this.errors.filter(k => k !== key);
      this.renderStepKeepScroll();
    };
    img.onerror = () => toast('That photo couldn\'t be read. Please try again.');
    img.src = url;
  },

  validate(fields) {
    const a = this.rec.answers;
    return fields.filter(f => f.req && visible(f, a) && (f.type === 'photo' ? !this.rec.photos[f.key] : !String(a[f.key] || '').trim())).map(f => f.key);
  },

  async next() {
    const s = this.steps[this.step];
    this.errors = this.validate(s.fields);
    if (this.errors.length) {
      this.renderStepKeepScroll();
      const el = document.querySelector('.q.err'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    $('#next').disabled = true; $('#next').textContent = 'Saving…';
    // drop answers to questions that are now hidden (e.g. switched Yes → No)
    s.fields.filter(f => !visible(f, this.rec.answers)).forEach(f => { delete this.rec.answers[f.key]; delete this.rec.photos[f.key]; });
    const local = this.rec, stepNow = this.step + 1, gps = this.gps;
    await mutate(local.id, x => {
      x.answers = local.answers; x.photos = local.photos; x.step = stepNow;
      if (gps) x.gps = gps;
    }, true).catch(() => {});
    this.step++;
    this.renderStep();
  },

  renderReview() {
    const r = this.rec, a = r.answers;
    const secs = this.steps.map((s, i) => {
      const fs = s.fields.filter(f => visible(f, a));
      const lines = fs.filter(f => f.type !== 'photo').map(f => `<div class="l"><span>${esc(f.label.length > 46 ? f.label.slice(0, 44) + '…' : f.label)}</span><b>${esc(a[f.key] || '—')}</b></div>`).join('');
      const thumbs = fs.filter(f => f.type === 'photo' && r.photos[f.key]).map(f => `<img src="${photoSrc(r, r.photos[f.key])}">`).join('');
      return `<div class="rv-sec"><div class="h">${esc(s.title)}<button class="linkbtn" data-edit="${i}">Edit</button></div>${lines}${thumbs ? `<div class="rv-thumbs">${thumbs}</div>` : ''}</div>`;
    }).join('');
    this.shell(`
      <h1>Review &amp; submit</h1>
      <p class="sub" style="margin-bottom:16px;">Check everything is right. Once submitted, answers and photos can't be changed.</p>
      ${secs}
      <label class="declare" id="decl"><input type="checkbox" id="declare"><span>I confirm I'm physically with this asset, the photos were taken just now, and the information is accurate to the best of my knowledge.</span></label>
      <div class="qerr small" id="declErr" style="display:none;color:#b8134f;margin-top:6px;">Please tick the declaration to submit.</div>`,
      `<button class="btn btn-outline" id="back">Back</button><button class="btn btn-primary" id="submit">Submit inspection</button>`, true);
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { this.step = +b.dataset.edit; this.renderStep(); });
    $('#back').onclick = () => { this.step--; this.renderStep(); };
    $('#submit').onclick = () => this.submit();
  },

  async submit() {
    if (!$('#declare').checked) { $('#declErr').style.display = 'block'; return; }
    $('#submit').disabled = true; $('#submit').textContent = 'Submitting…';
    const local = this.rec, gps = this.gps;
    // where is the address they typed? compare it with where the phone actually is
    let siteC = null;
    if (norm(local.answers.siteAddress) === norm(local.expectedAddress)) siteC = local.expectedCoords;
    else siteC = await geocode(local.answers.siteAddress) || local.expectedCoords;
    await mutate(local.id, x => {
      x.answers = local.answers; x.photos = local.photos; x.step = this.steps.length;
      if (gps) x.gps = gps;
      x.siteCoords = siteC; x.status = 'completed'; x.completedAt = Date.now();
      x.events.push({ t: Date.now(), by: 'Inspector', text: 'Inspection submitted' });
    }, true);
    if (this.watch != null) navigator.geolocation.clearWatch(this.watch);
    this.renderDone(false);
  },

  renderDone(already) {
    this.step = -1;
    const r = this.rec;
    this.shell(`
      <div style="text-align:center;">
        <div class="done-tick">✓</div>
        <h1>${already ? 'Already submitted' : 'Inspection submitted'}</h1>
        <p class="sub" style="font-size:14px;margin:8px 0 22px;">${already ? 'This inspection has already been completed.' : `Thanks, ${esc(r.inspector.name.split(' ')[0])}. Capitalflow has received your inspection and will be in touch if anything else is needed.`}</p>
        <div class="asset-card" style="text-align:left;">
          <div class="small">Request <b>#${r.id}</b> · Ref <b>${esc(r.proposalRef)}</b><br>${esc(assetName(r))} ${esc(r.asset.reg || '')}</div>
        </div>
        <p class="small muted">You can close this page.</p>
        <p class="small muted" style="margin-top:30px;">Demo: <a href="#/report/${r.id}" id="toReport">open the report as Capitalflow staff →</a></p>
      </div>`, null);
    $('#toReport').onclick = e => {
      e.preventDefault(); this.active = false;
      if (!me()) signIn(r.reviewer || 'u1');
      history.pushState(null, '', '/#/report/' + r.id); loadAll().then(() => { route(); scrollToY(0); });
    };
  },
};

// =====================================================================
//  Boot
// =====================================================================
(async function boot() {
  buildSeeds().forEach(s => { s.updatedAt = 0; SEEDS[s.id] = s; });
  await loadAll();
  PREV = JSON.parse(JSON.stringify(DB.insp));
  route();
  $('#stageReset').onclick = resetDemo;
  setInterval(poll, 4000);
})();
</script>
</body>
</html>
