<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capitalflow — Asset Inspections (Demo)</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --navy:#0e2a52; --navy-2:#153a6b; --pink:#e6237e; --green:#3aa635;
  --amber:#e9a21b; --red:#d6303a; --blue:#1a5aa3;
  --bg:#eef1f5; --panel:#f5f6f8; --panel-2:#ebedf0; --line:#dde2ea;
  --text:#1f2733; --mid:#6b7585; --white:#fff;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{font-family:Inter,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:var(--navy-2);}
.hidden{display:none !important;}

/* ---------- the phone: full screen on a phone, a device frame on a laptop ---------- */
.device{position:relative;background:var(--bg);}
.phone{min-height:100vh;}
#app{min-height:100vh;display:flex;flex-direction:column;}
.stage-note{display:none;}
@media (min-width:600px){
  body{background:#d3d9e1;}
  .stage{display:flex;flex-direction:column;align-items:center;padding:20px 16px;min-height:100vh;}
  .device{width:400px;height:min(860px, calc(100vh - 90px));border-radius:42px;border:11px solid #14171c;box-shadow:0 24px 60px rgba(14,42,82,.32);overflow:hidden;}
  .phone{height:100%;min-height:0;overflow-y:auto;scrollbar-width:none;}
  .phone::-webkit-scrollbar{display:none;}
  #app{min-height:100%;}
  .stage-note{display:block;font-size:12px;color:#55606f;text-align:center;max-width:400px;margin-top:12px;}
  .stage-note button{background:none;border:1px solid #9aa4b2;border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer;color:#3d4553;margin:8px 4px 0;}
}

/* ---------- staff app bar + bottom tabs ---------- */
.appbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:500;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));}
.logo-pill{background:#fff;border-radius:7px;padding:4px 8px;display:flex;align-items:center;flex-shrink:0;}
.logo-pill img{height:20px;width:auto;display:block;}
.appbar .sp{flex:1;}
.live{display:flex;align-items:center;gap:5px;font-size:11px;color:#a9bad1;}
.live i{width:7px;height:7px;border-radius:50%;background:#4cd964;box-shadow:0 0 0 3px rgba(76,217,100,.2);}
.live.off i{background:#999;box-shadow:none;}
.usermenu{position:relative;}
.userbtn{background:none;border:none;padding:0;cursor:pointer;display:flex;}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.dropdown{position:absolute;right:0;top:calc(100% + 8px);background:#fff;color:var(--text);border-radius:12px;box-shadow:0 12px 32px rgba(14,42,82,.28);width:250px;padding:6px;z-index:600;}
.dd-me{display:flex;gap:10px;align-items:center;padding:8px 10px;}
.dd-me small{display:block;color:var(--mid);font-size:11.5px;}
.dropdown .dd-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mid);padding:8px 10px 4px;}
.dropdown button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-size:13px;}
.dropdown button:hover{background:var(--panel);}
.dropdown button small{color:var(--mid);}
.dropdown hr{border:none;border-top:1px solid var(--line);margin:5px 0;}
.main{flex:1;padding:16px 14px 24px;}
.tabbar{position:sticky;bottom:0;z-index:400;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mid);text-decoration:none;padding:3px 0;position:relative;}
.tabbar a svg{width:22px;height:22px;}
.tabbar a.on{color:var(--pink);font-weight:600;}
.tabbar a.plus span.pc{width:42px;height:42px;margin-top:-16px;border-radius:50%;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(230,35,126,.4);border:3px solid #fff;}
.tabbar a.plus svg{width:20px;height:20px;}
.bellbtn{position:relative;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.08);}
.bellbtn.on{background:rgba(255,255,255,.22);}
.bellbtn svg{width:19px;height:19px;}
.bellbtn .dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--pink);border:1.5px solid var(--navy);}
.tabbar .dot{position:absolute;top:1px;left:50%;margin-left:7px;width:8px;height:8px;border-radius:50%;background:var(--pink);}

h1{font-size:20px;margin:0;color:var(--navy);letter-spacing:-.2px;}
h2{font-size:15px;margin:0 0 12px;color:var(--navy);}
h3{font-size:14px;margin:0 0 10px;color:var(--navy);}
.sub{color:var(--mid);margin:3px 0 0;font-size:12.5px;}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.back{display:inline-block;font-size:12.5px;color:var(--mid);text-decoration:none;margin-bottom:8px;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;}
.muted{color:var(--mid);}
.small{font-size:12px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:10px;padding:11px 16px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;}
.btn-primary{background:var(--pink);color:#fff;}
.btn-navy{background:var(--navy);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--text);}
.btn-danger-o{background:#fff;border:1px solid #f0b3c9;color:#b8134f;}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:9px;}
.btn-block{display:flex;width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.linkbtn{background:none;border:none;color:var(--navy-2);text-decoration:underline;cursor:pointer;padding:0;font-size:12.5px;}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.p-sent{background:#e3eefc;color:var(--blue);}
.p-progress{background:#fff1d6;color:#9a6200;}
.p-review{background:#e6e9f7;color:#2f3f8f;}
.p-approved{background:#def3dc;color:#2a7a26;}
.p-query{background:#fde1ec;color:#b8134f;}
.p-cancelled{background:#eceef1;color:#6b7585;}

/* inspections list */
.kpis{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 14px;padding:0 14px 2px;scrollbar-width:none;}
.kpis::-webkit-scrollbar{display:none;}
.kpi{flex:0 0 auto;min-width:104px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;}
.kpi.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);}
.kpi b{display:block;font-size:22px;line-height:1.1;color:var(--navy);font-weight:700;}
.kpi span{font-size:11.5px;color:var(--mid);white-space:nowrap;}
.kpi.k-amber b{color:#b57800;} .kpi.k-pink b{color:var(--pink);} .kpi.k-green b{color:var(--green);}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
.search{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;}
.toggle{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;flex-shrink:0;}
.toggle button{border:none;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500;color:var(--mid);}
.toggle button.on{background:var(--navy);color:#fff;}
.icard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;border-left:4px solid var(--line);}
.icard:active{background:#f8fafc;}
.icard.s-awaiting{border-left-color:var(--blue);} .icard.s-progress{border-left-color:var(--amber);} .icard.s-review{border-left-color:#2f3f8f;}
.icard.s-approved{border-left-color:var(--green);} .icard.s-query{border-left-color:var(--pink);}
.icard-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;}
.icard-cust{font-weight:600;font-size:15px;}
.icard-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px;}
.flags{display:flex;gap:5px;}
.fl{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;}
.fl svg{width:11px;height:11px;}
.fl.r{background:#fde3e4;color:var(--red);} .fl.a{background:#fff1d6;color:#a86e00;} .fl.s{background:#f0e6fb;color:#6d2fb0;} .fl.ok{background:#def3dc;color:#2a7a26;}
.progress-mini{height:5px;background:#eef0f3;border-radius:3px;margin:8px 0 4px;overflow:hidden;}
.progress-mini i{display:block;height:100%;background:var(--amber);}
.feed-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #eef0f3;font-size:13px;}
.feed-item:last-child{border-bottom:none;}
.feed-item .ft{color:var(--mid);font-size:11px;margin-top:2px;}
.empty{padding:30px 16px;text-align:center;color:var(--mid);}

/* forms */
.form-grid{display:grid;grid-template-columns:1fr;gap:12px;}
.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;}
.fld label .req{color:var(--pink);}
.fld .hint{font-size:11.5px;color:var(--mid);margin-top:4px;}
.inp{width:100%;background:#fff;border:1px solid #cfd6e0;border-radius:10px;padding:11px 12px;outline:none;font-size:16px;}
.inp:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(21,58,107,.12);}
.inp.err,.err .inp{border-color:var(--pink);background:#fff7fa;}
.seg{display:flex;gap:8px;flex-wrap:wrap;}
.seg button{flex:1;min-width:80px;background:#fff;border:1px solid #cfd6e0;border-radius:10px;padding:11px 10px;cursor:pointer;font-weight:500;text-align:center;}
.seg button.on{border-color:var(--navy);background:#eef3fa;color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);font-weight:600;}
.err .seg button{border-color:#f0a8c5;}
.boltons{display:grid;grid-template-columns:1fr;gap:8px;}
.bolt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;background:#fff;}
.bolt.on{border-color:var(--navy);background:#f3f6fb;}
.bolt input{margin-top:3px;width:18px;height:18px;accent-color:var(--navy);flex-shrink:0;}
.bolt b{display:block;font-size:13px;}
.bolt span{font-size:11.5px;color:var(--mid);}
.form-sec{margin-bottom:12px;}
.form-sec h2{display:flex;align-items:center;gap:9px;}
.form-sec h2 .n{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:11.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.side-note{background:#f3f6fb;border:1px solid #d5deeb;border-radius:14px;padding:14px;font-size:13px;margin-bottom:12px;}
.side-note ol{margin:8px 0 0;padding-left:18px;}
.side-note li{margin-bottom:5px;}
.two{display:flex !important;flex-direction:column;gap:12px;}
.two > *{min-width:0;}

/* request tracking */
.linkbox{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px dashed #b9c2cf;border-radius:10px;padding:9px 10px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all;}
.linkbox span{flex:1;}
.timeline{list-style:none;padding:0;margin:0;}
.timeline li{position:relative;padding:0 0 16px 28px;font-size:13px;}
.timeline li::before{content:'';position:absolute;left:7px;top:18px;bottom:-2px;width:2px;background:var(--line);}
.timeline li:last-child::before{display:none;}
.timeline li i{position:absolute;left:0;top:2px;width:16px;height:16px;border-radius:50%;border:2px solid #cfd6e0;background:#fff;}
.timeline li.done i{background:var(--green);border-color:var(--green);}
.timeline li.now i{border-color:var(--amber);background:#fff1d6;}
.timeline li small{display:block;color:var(--mid);font-size:11.5px;}
.sms{background:#e9e9eb;border-radius:18px 18px 18px 4px;padding:10px 13px;font-size:13px;}
.sms-from{font-size:11px;color:var(--mid);margin-bottom:5px;}
.qr{background:#fff;padding:6px;border-radius:8px;border:1px solid var(--line);display:inline-block;flex-shrink:0;}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;font-size:13px;}
.kv dt{color:var(--mid);} .kv dd{margin:0;font-weight:500;word-break:break-word;}

/* ---------- report ---------- */
.rep-actions{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
.rep-actions .sp{flex:1;}
.rblock{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:10px;}
.hero{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px;}
.hero-head{display:flex;align-items:center;gap:12px;padding:2px 2px 0;}
.hero-head img{height:30px;width:auto;flex-shrink:0;}
.hero-head > div{border-left:1px solid var(--line);padding-left:12px;}
.hero-brand{font-weight:700;color:var(--navy);font-size:12px;letter-spacing:.4px;text-transform:uppercase;}
.hero-photo{position:relative;border-radius:10px;overflow:hidden;cursor:zoom-in;}
.hero-photo img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;}
.hero-photo span{position:absolute;left:8px;top:8px;background:rgba(14,42,82,.85);color:#fff;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:7px;}
.impact-box{background:var(--panel);border-radius:12px;padding:11px 12px;display:flex;gap:11px;}
.impact-ico{width:32px;height:32px;border-radius:9px;background:#a5e6a0;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.impact-box b{font-size:13px;}
.impact-box ul{list-style:none;margin:4px 0 0;padding:0;font-size:12.5px;}
.impact-box li{display:flex;gap:7px;align-items:center;margin-top:3px;}
.leaf{width:7px;height:11px;border-radius:7px 7px 7px 0;background:#7fd27a;transform:rotate(-20deg);flex-shrink:0;}
.headcard-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px;}
.itype{font-size:17px;font-weight:700;color:var(--navy);letter-spacing:-.2px;line-height:1.25;}
.itype small{display:block;font-size:11.5px;font-weight:500;color:var(--mid);letter-spacing:0;margin-top:2px;}
.qstatus{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-weight:600;font-size:11.5px;color:var(--mid);flex-shrink:0;}
.qstatus span.ic{display:flex;gap:4px;}
.qstatus svg{width:26px;height:26px;}
.refrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;font-size:13px;}
.refrow .full{grid-column:1/-1;}
.hgrid{display:grid;grid-template-columns:1fr;gap:10px;background:var(--panel-2);border-radius:10px;padding:12px 14px;font-size:12.5px;}
.hgrid div span{display:block;color:var(--mid);font-size:11.5px;}
.hgrid div b{font-weight:600;word-break:break-word;}
.disclaimer{font-size:11px;color:#3d4553;line-height:1.55;}
.alert-box{background:#f5d3d5;border-radius:14px;padding:12px 14px;margin-bottom:10px;}
.alert-box .ar{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;margin:5px 0;}
.alert-box svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;}
.refbar{background:var(--panel);border-radius:12px;padding:11px 14px;font-size:15px;font-weight:600;margin-bottom:10px;}
.flagmap{display:flex;flex-direction:column;gap:10px;background:var(--panel);border-radius:14px;padding:10px;margin-bottom:10px;}
.flagcol{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.flagcard{background:#fff;border-radius:9px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;font-size:11.5px;cursor:pointer;border:1px solid transparent;text-align:center;}
.flagcard b{font-size:18px;}
.flagcard.on{border-color:var(--navy);}
.flagcard svg{width:18px;height:18px;}
.flaglist{grid-column:1/-1;background:#fff;border-radius:9px;padding:4px 12px;font-size:12px;}
.flaglist div{padding:7px 0;border-bottom:1px solid #eef0f3;}
.flaglist div:last-child{border-bottom:none;}
.mapwrap{position:relative;border-radius:10px;overflow:hidden;height:270px;background:#dfe7ee;}
#map{position:absolute;inset:0;}
.maplegend{position:absolute;left:8px;right:8px;bottom:8px;background:#fff;border-radius:10px;padding:8px 10px;font-size:11px;z-index:400;box-shadow:0 2px 10px rgba(0,0,0,.12);}
.maplegend .ea{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:3px;}
.mk{width:22px;height:22px;border-radius:50%;color:#fff;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);}
.mk-e{background:#7fd27a;color:#1d4d1a;} .mk-a{background:var(--red);}
.mk-line{width:26px;height:3px;background:var(--red);border-radius:2px;}
.impact2{display:grid;grid-template-columns:1fr;gap:8px;}
.impact2 .col{border-radius:10px;padding:12px 14px;background:#fff;}
.impact2 .col.hl{background:var(--panel-2);}
.impact2 h4{margin:0 0 6px;font-size:14px;font-weight:600;}
.impact2 ul{list-style:none;margin:0;padding:0;font-size:12.5px;}
.impact2 li{display:flex;gap:9px;align-items:center;padding:4px 0;}
.footnotes{font-size:10.5px;color:#3d4553;font-style:italic;margin-top:10px;line-height:1.5;}
.sec{background:var(--panel);border-radius:14px;padding:12px;margin-bottom:10px;break-inside:avoid-page;}
.sec-t{font-weight:700;font-size:15px;padding:2px 2px 10px;}
.sec-rows{display:flex;flex-direction:column;gap:8px;}
.qa{background:#fff;border-radius:9px;padding:9px 12px;font-size:12px;color:var(--mid);}
.qa .ans{display:block;color:var(--text);font-size:14px;font-weight:600;margin-top:2px;}
.qa .ans.bad{color:var(--red);}
.qa .ans.warn{color:#a86e00;}
.qa .ans .match{font-size:11px;font-weight:600;margin-left:6px;}
.ph{background:var(--panel-2);border-radius:9px;padding:9px 12px 12px;font-size:12.5px;}
.ph-card{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;margin-top:8px;cursor:zoom-in;}
.ph-card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px 8px 22px 8px;display:block;}
.ph-card .st{font-size:10.5px;color:#3d4553;display:flex;align-items:center;gap:4px;margin-top:6px;}
.ph-card .st svg{width:12px;height:12px;}
.ph-card .spoof{font-size:10.5px;color:#6d2fb0;font-weight:700;margin-top:3px;}
.qa-note{font-size:12px;color:#3d4553;background:#fff;border-left:3px solid var(--amber);border-radius:6px;padding:8px 12px;}
.bolt-list{padding-left:18px;margin:0;}
.bolt-list li{margin-bottom:9px;font-size:12px;}
.bolt-list b{display:block;font-size:13px;}
.review-panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.decision{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:10px;margin-bottom:12px;font-size:13px;}
.decision.d-none{background:#e6e9f7;} .decision.d-ok{background:#def3dc;} .decision.d-q{background:#fde1ec;}
.review-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.review-btns .wide{grid-column:1/-1;}
.comment{display:flex;gap:9px;margin-bottom:10px;font-size:13px;}
.comment .cb{background:var(--panel);border-radius:12px;padding:8px 11px;flex:1;}
.comment .cb small{color:var(--mid);font-size:11px;}
.audit li{font-size:12px;margin-bottom:6px;}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out;}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px;}
.sticky-review{position:sticky;bottom:0;z-index:300;margin:0 -14px -24px;padding:10px 14px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;gap:8px;}
.sticky-review .btn{flex:1;}

/* ---------- inspector (link) flow ---------- */
.ins{min-height:100%;flex:1;background:#fff;display:flex;flex-direction:column;}
.ins-top{background:var(--navy);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:50;}
.ins-top .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.ins-top .stepname{font-size:12px;color:#c8d3e3;}
.pbar{height:5px;background:rgba(255,255,255,.18);border-radius:4px;margin-top:10px;overflow:hidden;}
.pbar i{display:block;height:100%;background:var(--pink);transition:width .3s;}
.ins-body{flex:1;padding:18px 16px 24px;}
.ins-body h1{font-size:21px;}
.gps-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 10px;border-radius:20px;background:#def3dc;color:#2a7a26;font-weight:600;margin-bottom:12px;}
.gps-chip.wait{background:#eef0f3;color:var(--mid);}
.gps-chip.bad{background:#fde1ec;color:#b8134f;}
.q{margin-bottom:20px;}
.q > label{display:block;font-weight:600;font-size:14px;margin-bottom:8px;}
.q > label .req{color:var(--pink);}
.q .qerr{display:none;color:#b8134f;font-size:12px;margin-top:5px;}
.q.err .qerr{display:block;}
.ins .inp{padding:13px 14px;}
.ins .seg button{padding:13px 10px;font-size:15px;}
.ptile{position:relative;border:2px dashed #cfd6e0;border-radius:12px;background:var(--panel);height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mid);text-align:center;font-size:13px;cursor:pointer;}
.ptile.has{border-style:solid;border-color:var(--green);}
.err .ptile{border-color:var(--pink);}
.ptile img{width:100%;height:100%;object-fit:cover;}
.ptile .tick{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;}
.ptile svg{width:34px;height:34px;display:block;margin:0 auto 6px;}
.prow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px;}
.ins-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;}
.ins-foot .btn{flex:1;padding:14px;font-size:15px;}
.need{list-style:none;padding:0;margin:12px 0;}
.need li{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #eef0f3;font-size:14px;}
.need li .ni{width:30px;height:30px;border-radius:8px;background:#eef3fa;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;}
.asset-card{background:var(--panel);border-radius:12px;padding:14px;margin:14px 0;}
.asset-card > b{font-size:16px;color:var(--navy);}
.notice{border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:14px;}
.n-info{background:#eef3fa;color:#1d3a66;}
.n-warn{background:#fff4dc;color:#7a5200;}
.n-err{background:#fde1ec;color:#8a0f3d;}
.rv-sec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.rv-sec .h{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:6px;}
.rv-sec .l{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;}
.rv-sec .l span{color:var(--mid);}
.rv-sec .l b{text-align:right;}
.rv-thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.rv-thumbs img{width:54px;height:54px;object-fit:cover;border-radius:7px;}
.declare{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;background:var(--panel);border-radius:10px;padding:12px;}
.declare input{width:20px;height:20px;accent-color:var(--navy);flex-shrink:0;}
.done-tick{width:72px;height:72px;border-radius:50%;background:var(--green);color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center;margin:40px auto 18px;}

/* login */
.login{flex:1;display:flex;flex-direction:column;background:#fff;}
.login-hero{background:var(--navy);color:#fff;padding:22px 18px 26px;padding-top:calc(22px + env(safe-area-inset-top));}
.login-hero h1{color:#fff;font-size:23px;line-height:1.2;margin-top:22px;}
.login-hero p{color:#c8d3e3;font-size:13.5px;margin:8px 0 0;}
.login-hero ul{list-style:none;padding:0;margin:14px 0 0;color:#dfe7f2;font-size:13px;}
.login-hero li{margin:7px 0;display:flex;gap:9px;}
.login-hero li::before{content:'✓';color:#7fd27a;font-weight:700;}
.login-body{padding:20px 18px 28px;}
.quick-users button{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;text-align:left;}
.quick-users button:active{border-color:var(--navy);}
.quick-users small{display:block;color:var(--mid);font-size:11.5px;}

/* team */
.ucard{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
.ucard .uinfo{flex:1;min-width:0;}
.ucard .uinfo small{display:block;color:var(--mid);font-size:11.5px;word-break:break-all;}
.ucard .umeta{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--mid);flex-wrap:wrap;}
.rolepill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:#eef3fa;color:var(--navy);}
.roles{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.role-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:12.5px;}
.role-card b{display:block;font-size:13px;margin-bottom:2px;color:var(--navy);}

.toast-wrap{position:fixed;left:12px;right:12px;bottom:80px;z-index:3000;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.device .toast-wrap{position:absolute;}
.toast{background:var(--navy);color:#fff;border-radius:12px;padding:11px 14px;font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.25);animation:tin .25s ease-out;}
@keyframes tin{from{transform:translateY(10px);opacity:0;}to{transform:none;opacity:1;}}

@media print{
  body{background:#fff;}
  .stage{padding:0;display:block;}
  .device{width:auto;height:auto;border:none;box-shadow:none;border-radius:0;overflow:visible;}
  .phone{height:auto;overflow:visible;}
  .appbar,.tabbar,.rep-actions,.no-print,.toast-wrap,.stage-note,.sticky-review{display:none !important;}
  .main{padding:0;}
  .sec,.rblock,.flagmap,.alert-box{break-inside:avoid;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>
<div class="stage">
  <div class="device">
    <div class="phone" id="phone"><div id="app"></div></div>
    <div class="toast-wrap" id="toasts"></div>
  </div>
  <div class="stage-note">Phone demo. Staff use the Capitalflow side; the inspector link opens the customer / dealer view in a new tab.<br>
    <button id="stageReset">↺ Reset demo data</button></div>
</div>

<script>
// =====================================================================
//  Reference data
// =====================================================================
const LOGO = '/logo.png';
const CLIENT = 'Capitalflow Commercial Finance';
const HQ = { lat: 53.3398, lon: -6.2493, label: 'Capitalflow head office, Dublin' };

const CATS = {
  car:   { label: 'Vehicle (Car — private passenger)', kind: 'vehicle', noun: 'vehicle' },
  lcv:   { label: 'Vehicle (Light commercial / van)',   kind: 'vehicle', noun: 'vehicle' },
  hgv:   { label: 'Vehicle (HGV / truck)',              kind: 'vehicle', noun: 'vehicle' },
  plant: { label: 'Plant & machinery',                  kind: 'plant',   noun: 'machine' },
  agri:  { label: 'Agricultural machinery',             kind: 'plant',   noun: 'machine' },
};

const INSPECTOR_ROLES = {
  Customer: 'Self-inspection by customer',
  Dealer:   'Inspection by supplying dealer',
  Broker:   'Inspection by introducing broker',
};

// optional extra checks on top of the standard inspection
const BOLTONS = [
  { key: 'insurance', name: 'Insurance records', desc: 'Photo of the current insurance certificate', kinds: ['vehicle', 'plant'],
    fields: [
      { key: 'insPhoto', label: 'Photo of the insurance certificate', type: 'photo', req: true, sample: 'doc' },
      { key: 'insurer', label: 'Insurer', type: 'text', req: true },
      { key: 'insExpiry', label: 'Policy expiry date', type: 'date', req: true },
    ] },
  { key: 'vrc', name: 'Vehicle Registration Certificate (VRC)', desc: 'Photo of the logbook, checked against the customer', kinds: ['vehicle'],
    fields: [
      { key: 'vrcPhoto', label: 'Photo of the Vehicle Registration Certificate', type: 'photo', req: true, sample: 'doc' },
      { key: 'vrcOwner', label: 'Is the registered owner on the certificate the customer?', type: 'yesno', req: true },
    ] },
  { key: 'tracker', name: 'Proof of immobiliser / tracker fitted', desc: 'Evidence of a tracker or approved immobiliser', kinds: ['vehicle', 'plant'],
    fields: [
      { key: 'trackerFitted', label: 'Is a tracker or approved immobiliser fitted?', type: 'yesno', req: true },
      { key: 'trackerPhoto', label: 'Photo of the tracker / immobiliser or its certificate', type: 'photo', req: true, sample: 'doc', when: a => a.trackerFitted === 'Yes' },
    ] },
  { key: 'service', name: 'Service records', desc: 'Service history at the manufacturer intervals', kinds: ['vehicle', 'plant'],
    fields: [
      { key: 'serviceUpToDate', label: 'Is the service history up to date?', type: 'yesno', req: true },
      { key: 'servicePhoto', label: 'Photo of the service book or latest invoice', type: 'photo', req: true, sample: 'doc' },
    ] },
  { key: 'keys', name: 'Number of keys present', desc: 'Count and photo of the keys with the asset', kinds: ['vehicle', 'plant'],
    fields: [
      { key: 'keysCount', label: 'How many keys are present?', type: 'choice', options: ['1', '2', '3 or more'], req: true },
      { key: 'keysPhoto', label: 'Photo of all keys together', type: 'photo', req: true, sample: 'keys' },
    ] },
];

const ROLES = {
  Admin:     'Everything, plus inviting and removing colleagues',
  Reviewer:  'Request inspections, review reports, approve or raise a query',
  Requester: 'Request inspections and follow their progress (e.g. brokers, sales)',
};

const AV_COLORS = ['#e6237e', '#1a5aa3', '#3aa635', '#b57800', '#6d2fb0', '#0e8a8a'];

// =====================================================================
//  Helpers
// =====================================================================
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtStamp(t) { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; }
function fmtLong(t) { const d = new Date(t); return `${pad(d.getDate())} ${MONTHS[d.getMonth()]}, ${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDate(t) { const d = new Date(t); return `${pad(d.getDate())} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`; }
function fmtAgo(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  if (s < 172800) return 'yesterday';
  return fmtDate(t);
}
function initials(name) { return name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase(); }
function avatar(u, size) {
  const i = Math.abs([...u.name].reduce((a, c) => a + c.charCodeAt(0), 0)) % AV_COLORS.length;
  return `<span class="avatar" style="background:${AV_COLORS[i]};${size ? `width:${size}px;height:${size}px;` : ''}">${initials(u.name)}</span>`;
}
function haversineKm(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const rnd = n => Math.random().toString(36).slice(2, 2 + n);
const ago = (days, h = 0, m = 0) => { const d = new Date(); d.setDate(d.getDate() - days); if (h || m) d.setHours(h, m, Math.floor(Math.random() * 59)); return d.getTime(); };
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 5200);
}
const ICON = {
  flag: c => `<svg viewBox="0 0 24 24"><path d="M5 22V3h12l-2 4.5L17 12H7v10z" fill="${c}"/></svg>`,
  pin: c => `<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" fill="${c}"/></svg>`,
  pinO: `<svg viewBox="0 0 24 24" fill="none" stroke="#3d4553" stroke-width="2"><path d="M12 22s7-8 7-13a7 7 0 0 0-14 0c0 5 7 13 7 13z"/><circle cx="12" cy="9" r="2.5"/></svg>`,
  warn: `<svg viewBox="0 0 24 24"><path d="M12 2 1 21h22L12 2zm1 15h-2v-2h2v2zm0-4h-2V9h2v4z" fill="#1f2733"/></svg>`,
  chev: `<svg viewBox="0 0 24 24"><path d="M3 5h8l7 7-7 7H3l7-7z" fill="none" stroke="#1f2733" stroke-width="2"/></svg>`,
  spoof: c => `<svg viewBox="0 0 24 24"><path d="M12 2 2 21h20L12 2z" fill="${c}"/><text x="12" y="18" font-size="7" font-weight="700" text-anchor="middle" fill="#fff" font-family="Arial">!</text></svg>`,
  cam: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="4"/></svg>`,
  leafbox: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#1d4d1a" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 17V9m0 3 3-3m-3 5-3-3"/></svg>`,
};

// =====================================================================
//  Sample "photos" — drawn on a canvas so the demo works without a camera
// =====================================================================
const SAMPLE_CACHE = {};
const ASSET_COLORS = { car: '#8d939b', lcv: '#f1f2f3', hgv: '#d9dde2', plant: '#f2b705', agri: '#2f8f3a' };

function drawStamp(ctx, w, h, t, gps) {
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(0, h - 30, w, 30);
  ctx.fillStyle = '#fff';
  ctx.font = '600 14px Inter, Arial';
  const where = gps ? `${gps.lat.toFixed(5)}, ${gps.lon.toFixed(5)}` : 'location unavailable';
  ctx.fillText(`${fmtStamp(t)}   •   ${where}`, 10, h - 10);
}

function samplePhoto(kind, cat, text, t, gps) {
  const key = [kind, cat, text, t].join('|');
  if (SAMPLE_CACHE[key]) return SAMPLE_CACHE[key];
  const W = 640, H = 480;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const col = ASSET_COLORS[cat] || '#8d939b';
  const plant = CATS[cat] && CATS[cat].kind === 'plant';
  const rr = (X, Y, w, h, r, fill) => { x.beginPath(); x.roundRect(X, Y, w, h, r); x.fillStyle = fill; x.fill(); };
  const wheel = (X, Y, r) => { x.beginPath(); x.arc(X, Y, r, 0, 7); x.fillStyle = '#1d1f22'; x.fill(); x.beginPath(); x.arc(X, Y, r * .45, 0, 7); x.fillStyle = '#9aa0a6'; x.fill(); };
  const scene = () => {
    let g = x.createLinearGradient(0, 0, 0, H * .58); g.addColorStop(0, '#b9cde0'); g.addColorStop(1, '#e9eef3');
    x.fillStyle = g; x.fillRect(0, 0, W, H * .58);
    g = x.createLinearGradient(0, H * .58, 0, H); g.addColorStop(0, '#8e959c'); g.addColorStop(1, '#6b7178');
    x.fillStyle = g; x.fillRect(0, H * .58, W, H);
    x.fillStyle = '#c2c9cf'; x.fillRect(0, H * .5, W, 12);
  };
  const plate = (X, Y) => { rr(X, Y, 130, 30, 4, '#fff'); x.fillStyle = '#111'; x.font = '700 17px Arial'; x.textAlign = 'center'; x.fillText(text || '', X + 65, Y + 21); x.textAlign = 'left'; };

  if (['front', 'rear', 'right', 'left', 'cab'].includes(kind)) {
    scene();
    if (plant) {
      // tracked machine, side-on
      rr(110, 300, 400, 70, 35, '#2a2c2f'); [150, 230, 310, 390, 470].forEach(X => wheel(X, 335, 22));
      rr(150, 230, 300, 75, 8, col);
      rr(170, 140, 120, 95, 8, col); rr(184, 152, 92, 60, 4, '#2c3e50');
      x.strokeStyle = col; x.lineWidth = 26; x.lineCap = 'round';
      const flip = kind === 'left' || kind === 'rear' ? -1 : 1;
      x.beginPath(); x.moveTo(320 + 100 * flip, 250); x.lineTo(320 + 200 * flip, 150); x.lineTo(320 + 250 * flip, 290); x.stroke();
      rr(320 + 225 * flip - 30, 285, 60, 40, 6, '#3a3c40');
    } else if (kind === 'front' || kind === 'rear') {
      const tall = cat === 'lcv' || cat === 'hgv';
      rr(140, tall ? 150 : 215, 360, tall ? 205 : 140, 26, col);
      rr(175, tall ? 165 : 180, 290, tall ? 75 : 70, 16, kind === 'front' ? '#33414f' : '#2b3540');
      if (kind === 'front') { rr(165, 285, 70, 26, 9, '#f6f7f8'); rr(405, 285, 70, 26, 9, '#f6f7f8'); rr(262, 278, 116, 40, 10, '#26282b'); }
      else { rr(150, 270, 80, 28, 7, '#c4232c'); rr(410, 270, 80, 28, 7, '#c4232c'); }
      plate(255, 322); wheel(185, 368, 26); wheel(455, 368, 26);
    } else {
      const tall = cat === 'lcv' || cat === 'hgv';
      rr(70, tall ? 150 : 225, 500, tall ? 190 : 110, 30, col);
      if (!tall) { x.beginPath(); x.moveTo(190, 228); x.lineTo(250, 160); x.lineTo(420, 160); x.lineTo(480, 228); x.fillStyle = col; x.fill(); }
      rr(tall ? 90 : 220, tall ? 165 : 172, tall ? 120 : 120, 55, 8, '#33414f');
      if (!tall) rr(352, 172, 100, 55, 8, '#33414f');
      wheel(170, 340, 40); wheel(470, 340, 40);
    }
  } else if (kind === 'interior') {
    x.fillStyle = '#1e2226'; x.fillRect(0, 0, W, H);
    rr(0, 250, W, 230, 0, '#2c3136'); rr(60, 120, 520, 70, 14, '#5c6a78');
    x.beginPath(); x.arc(220, 330, 95, 0, 7); x.lineWidth = 20; x.strokeStyle = '#111'; x.stroke();
    rr(360, 270, 170, 100, 10, '#0f1316'); x.fillStyle = '#59b8ff'; x.font = '600 18px Arial'; x.fillText('12:04   21°', 385, 325);
  } else if (kind === 'vin') {
    x.fillStyle = '#2b2f33'; x.fillRect(0, 0, W, H);
    rr(80, 150, 480, 170, 12, '#c9ced3'); rr(92, 162, 456, 146, 8, '#dde1e5');
    x.fillStyle = '#333'; x.font = '600 18px Arial'; x.fillText(plant ? 'PRODUCT IDENTIFICATION NUMBER' : 'VEHICLE IDENTIFICATION NUMBER', 110, 200);
    x.font = '700 30px Menlo, Courier, monospace'; x.fillText(text || '', 110, 260);
    x.font = '14px Arial'; x.fillStyle = '#555'; x.fillText('MADE IN ' + (plant ? 'BELGIUM' : 'GERMANY'), 110, 292);
  } else if (kind === 'odo') {
    x.fillStyle = '#121416'; x.fillRect(0, 0, W, H);
    x.beginPath(); x.arc(320, 230, 170, Math.PI * .8, Math.PI * 2.2); x.lineWidth = 8; x.strokeStyle = '#e9eef3'; x.stroke();
    rr(200, 280, 240, 56, 8, '#000'); x.fillStyle = '#ffb02e'; x.font = '700 34px Menlo, Courier, monospace'; x.textAlign = 'center'; x.fillText(text || '', 320, 320);
    x.fillStyle = '#ccc'; x.font = '15px Arial'; x.fillText(plant ? 'HOURS' : 'TOTAL', 320, 268); x.textAlign = 'left';
  } else if (kind === 'doc') {
    x.fillStyle = '#7b6a58'; x.fillRect(0, 0, W, H);
    x.save(); x.translate(320, 240); x.rotate(-.05);
    rr(-190, -210, 380, 420, 4, '#fbfbf8');
    x.fillStyle = '#0e2a52'; x.font = '700 20px Arial'; x.fillText(text || 'DOCUMENT', -160, -160);
    x.fillStyle = '#c9ced3'; for (let i = 0; i < 11; i++) x.fillRect(-160, -120 + i * 28, i % 3 === 2 ? 200 : 320, 9);
    x.restore();
  } else if (kind === 'storage') {
    scene();
    rr(60, 120, 520, 260, 0, '#b8aa96'); rr(240, 200, 160, 180, 0, '#6d5b45');
    x.strokeStyle = '#222'; x.lineWidth = 6;
    for (let i = 0; i < 16; i++) { x.beginPath(); x.moveTo(30 + i * 38, 250); x.lineTo(30 + i * 38, 400); x.stroke(); }
    x.beginPath(); x.moveTo(20, 260); x.lineTo(620, 260); x.moveTo(20, 390); x.lineTo(620, 390); x.stroke();
  } else if (kind === 'keys') {
    x.fillStyle = '#6e4f33'; x.fillRect(0, 0, W, H);
    const k = (X, Y, r) => { x.save(); x.translate(X, Y); x.rotate(r); rr(-30, -45, 60, 90, 18, '#1b1d20'); rr(-8, 45, 16, 90, 3, '#c0c4c9'); x.restore(); };
    k(230, 200, -.3); k(380, 220, .25); if (text === '3') k(310, 300, 1.2);
  }
  drawStamp(x, W, H, t || Date.now(), gps);
  return (SAMPLE_CACHE[key] = c.toDataURL('image/jpeg', .72));
}

// seeded photos are stored as "sample:<kind>:<text>" and drawn on demand
function photoSrc(rec, p) {
  if (!p) return '';
  if (p.src && p.src.startsWith('sample:')) {
    const [, kind, text] = p.src.split(':');
    return samplePhoto(kind, rec.category, text, p.t, p.lat != null ? { lat: p.lat, lon: p.lon } : null);
  }
  return p.src;
}

// =====================================================================
//  Inspection questions (one schema drives the link flow AND the report)
// =====================================================================
function buildSteps(rec) {
  const cat = CATS[rec.category];
  const veh = cat.kind === 'vehicle';
  const noun = cat.noun, Noun = noun[0].toUpperCase() + noun.slice(1);
  const sides = veh
    ? [['front', 'front', 'Front', 'front'], ['rear', 'rear', 'Rear', 'rear'], ['right', 'right hand side', 'Right Side', 'right'], ['left', 'left hand side', 'Left Side', 'left'], ['interior', 'interior', 'Interior', 'interior']]
    : [['front', 'front', 'Front', 'front'], ['rear', 'rear', 'Rear', 'rear'], ['right', 'right hand side', 'Right Side', 'right'], ['left', 'left hand side', 'Left Side', 'left'], ['cab', 'cab / operator station', 'Cab', 'interior']];

  const steps = [
    { key: 'site', title: 'Inspection location', intro: `Confirm the address where the ${noun} is right now. Your phone's location is recorded alongside it.`,
      fields: [{ key: 'siteAddress', label: 'Address where the asset is being inspected', type: 'textarea', req: true }] },
    { key: 'asset', title: 'Asset Details',
      fields: [
        { key: 'make', label: 'Manufacturer', type: 'text', req: true },
        { key: 'model', label: 'Model', type: 'text', req: true },
        { key: 'year', label: 'Year of Manufacture', type: 'number', req: true },
        veh ? { key: 'reg', label: 'Registration Number', type: 'text', req: true, upper: true, check: 'reg' }
            : { key: 'fleetNo', label: 'Fleet / ID number (if any)', type: 'text' },
        { key: 'working', label: `Was the ${noun} working?`, type: 'yesno', req: true },
      ] },
    { key: 'vin', title: veh ? 'VIN/Chassis Number' : 'Serial / PIN Plate',
      fields: [
        { key: 'vin', label: veh ? 'VIN/Chassis Number' : 'Serial / PIN number', type: 'text', req: true, upper: true, check: 'vin' },
        { key: 'vinPhoto', label: veh ? 'Take photo of VIN number' : 'Take photo of the serial plate', type: 'photo', req: true, sample: 'vin', sampleText: a => a.vin },
        { key: 'vinTamper', label: `Is there evidence of ${veh ? 'VIN' : 'serial plate'} tampering?`, type: 'yesno', req: true },
      ] },
    veh
      ? { key: 'meter', title: 'Mileage/Odometer',
          fields: [
            { key: 'odoUnit', label: 'What is unit used', type: 'choice', options: ['Kms', 'Miles'], req: true },
            { key: 'odo', label: 'Odometer Reading', type: 'number', req: true },
            { key: 'odoPhoto', label: 'Odometer Reading Photo', type: 'photo', req: true, sample: 'odo', sampleText: a => String(a.odo || '').padStart(6, '0') + ' ' + (a.odoUnit === 'Miles' ? 'mi' : 'km') },
          ] }
      : { key: 'meter', title: 'Hour Meter',
          fields: [
            { key: 'hours', label: 'Hour meter reading', type: 'number', req: true },
            { key: 'hoursPhoto', label: 'Hour meter photo', type: 'photo', req: true, sample: 'odo', sampleText: a => String(a.hours || '').padStart(6, '0') },
          ] },
    { key: 'cond', title: `${Noun} Condition`,
      fields: sides.flatMap(([k, l, L, sample]) => [
        { key: 'cond_' + k, label: `What is the condition of the ${l} of the ${noun}`, type: 'choice', options: ['Good', 'Fair', 'Poor', 'Damaged'], req: true },
        { key: 'photo_' + k, label: `${Noun} condition photo (${L})`, type: 'photo', req: true, sample, sampleText: a => a.reg || '' },
      ]) },
    { key: 'docs', title: 'Documents',
      fields: [
        { key: 'pop', label: 'Is the proof of purchase document (supplier invoice or bill of sale) present?', type: 'yesno', req: true,
          note: a => a.pop === 'No' ? 'The response indicates that there is no proof of purchase available with the asset at the time of inspection. If this is required by the lender, further investigation is advisable.' : '' },
        { key: 'popPhoto', label: 'Photo of the proof of purchase', type: 'photo', req: true, sample: 'doc', sampleText: () => 'INVOICE', when: a => a.pop === 'Yes' },
        { key: 'popWhy', label: 'Proof of Purchase Document (invoice/bill of sale) not present - explanation', type: 'textarea', req: true, when: a => a.pop === 'No' },
      ] },
    { key: 'storage', title: 'Storage & Security',
      fields: [
        { key: 'storedWhere', label: `Where is the ${noun} usually stored?`, type: 'choice', req: true,
          options: veh ? ['Secure Driveway', 'Locked Garage', 'Secure Yard / Compound', 'On-street'] : ['Secure Yard / Compound', 'Locked Shed / Building', 'On Site (active job)', 'Other'] },
        { key: 'secured', label: 'Description of how entry to building or driveway is physically secured', type: 'text', req: true },
        { key: 'storagePhoto', label: 'Please take photos of building or driveway where asset is stored.', type: 'photo', req: true, sample: 'storage' },
      ] },
  ];

  const chosen = BOLTONS.filter(b => (rec.boltOns || []).includes(b.key) && b.kinds.includes(cat.kind));
  if (chosen.length) {
    steps.push({ key: 'bolt', title: 'Additional checks', intro: 'Capitalflow asked for these extra checks on this asset.',
      fields: chosen.flatMap(b => b.fields.map(f => ({ ...f, sampleText: f.sampleText || (() => b.name.toUpperCase().slice(0, 26)) }))) });
  }
  return steps;
}

const visible = (f, a) => !f.when || f.when(a);

// =====================================================================
//  Flags, location checks and impact numbers
// =====================================================================
const norm = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

function siteCoords(rec) { return rec.siteCoords || rec.expectedCoords; }

function computeFlags(rec) {
  const red = [], amber = [], spoof = [], loc = {};
  if (!rec.answers || rec.status !== 'completed') return { red, amber, spoof, loc };
  const a = rec.answers;
  const site = siteCoords(rec);

  if (!rec.gps) {
    red.push('The inspector\'s device did not share its location, so where the inspection took place can\'t be confirmed.');
  } else if (site) {
    const km = haversineKm(site, rec.gps);
    loc.km = km;
    if (km > 1.5) {
      loc.mismatch = true;
      (km > 50 ? red : amber).push(`Location mismatch: the inspection was performed ${km.toFixed(1)} km from the address the inspector entered.`);
    }
  }
  if (rec.asset.vin && a.vin && norm(rec.asset.vin) !== norm(a.vin)) red.push(`VIN/serial entered (${a.vin}) does not match the record on file (${rec.asset.vin}).`);
  if (rec.asset.reg && a.reg && norm(rec.asset.reg) !== norm(a.reg)) amber.push(`Registration entered (${a.reg}) does not match the record on file (${rec.asset.reg}).`);
  if (a.vinTamper === 'Yes') red.push('Inspector reported evidence of VIN/serial tampering.');
  if (a.working === 'No') amber.push('Inspector reported the asset was not working.');
  Object.keys(a).filter(k => k.startsWith('cond_')).forEach(k => {
    if (a[k] === 'Poor' || a[k] === 'Damaged') amber.push(`Condition reported as ${a[k]} (${k.slice(5)}).`);
  });
  if (a.vrcOwner === 'No') amber.push('Registered owner on the VRC is not the customer.');
  if (a.trackerFitted === 'No') amber.push('No tracker / immobiliser fitted.');

  Object.entries(rec.photos || {}).forEach(([k, p]) => {
    if (p.live === false) spoof.push(`Photo "${fieldLabel(rec, k)}" was not taken live — the file was created before this inspection started (uploaded from the gallery).`);
    else if (rec.gps && p.lat != null && haversineKm(rec.gps, { lat: p.lat, lon: p.lon }) > 1) spoof.push(`Photo "${fieldLabel(rec, k)}" was taken away from the inspection location.`);
  });
  return { red, amber, spoof, loc };
}

function fieldLabel(rec, key) {
  for (const s of buildSteps(rec)) for (const f of s.fields) if (f.key === key) return f.label;
  return key;
}

function impact(rec) {
  if (!rec.gps) return null;
  const km = haversineKm(HQ, rec.gps) * 1.25 * 2;   // round trip by road
  if (km < 10) return null;                          // too close to head office to be worth showing
  const co2 = km * 0.171;                            // kg
  const hours = km / 65 + 1;                         // driving + an hour on site
  const fuel = km * 0.31;
  return { km, co2, trees: co2 / 22, credit: co2 / 1000 * 70, hours, fuel, expenses: 15, saving: fuel + 15 };
}

// =====================================================================
const LS_KEY = 'cfi.overrides.v1';
const LS_TEAM = 'cfi.team.v1';
let SERVER = true;
let DB = { insp: {}, team: SEED_TEAM.map(u => ({ ...u })) };
let SEEDS = {};

function lsGet(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

async function fetchRemote() {
  if (SERVER) {
    try {
      const [ins, team] = await Promise.all([
        fetch('/api/inspections', { cache: 'no-store' }).then(r => { if (!r.ok) throw 0; return r.json(); }),
        fetch('/api/kv/team', { cache: 'no-store' }).then(r => r.json()),
      ]);
      return { ins, team };
    } catch (e) { SERVER = false; }
  }
  return { ins: Object.values(lsGet(LS_KEY, {})), team: lsGet(LS_TEAM, null) };
}

// returns the ids whose record changed since the last load
async function loadAll() {
  const { ins, team } = await fetchRemote();
  const next = {};
  Object.values(SEEDS).forEach(s => next[s.id] = s);
  (ins || []).forEach(r => next[r.id] = r);
  const changed = Object.keys(next).filter(id => DB.insp[id] && (DB.insp[id].updatedAt || 0) !== (next[id].updatedAt || 0));
  DB.insp = next;
  if (team && team.length) DB.team = team;
  return changed.map(id => ({ before: PREV[id], after: next[id] }));
}
let PREV = {};

async function saveRec(rec, fromInspector) {
  rec.updatedAt = Date.now();
  DB.insp[rec.id] = rec;
  if (SERVER) {
    try {
      const r = await fetch('/api/inspections/' + rec.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...rec, _fromInspector: !!fromInspector }) });
      if (r.ok) { DB.insp[rec.id] = await r.json(); return DB.insp[rec.id]; }
    } catch (e) { SERVER = false; }
  }
  const all = lsGet(LS_KEY, {}); all[rec.id] = rec; lsSet(LS_KEY, all);
  return rec;
}

async function saveTeam() {
  if (SERVER) {
    try { await fetch('/api/kv/team', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(DB.team) }); return; } catch (e) {}
  }
  lsSet(LS_TEAM, DB.team);
}

// read-modify-write so the office and the inspector don't overwrite each other
async function mutate(id, fn, fromInspector) {
  if (SERVER) {
    try {
      const r = await fetch('/api/inspections/' + id, { cache: 'no-store' });
      if (r.ok) DB.insp[id] = await r.json();
    } catch (e) {}
  } else {
    const all = lsGet(LS_KEY, {}); if (all[id]) DB.insp[id] = all[id];
  }
  const rec = JSON.parse(JSON.stringify(DB.insp[id]));
  fn(rec);
  return saveRec(rec, fromInspector);
}

}

function statusOf(r) {
  if (r.status === 'cancelled') return ['cancelled', 'Cancelled', 'p-cancelled'];
  if (r.status === 'sent') return ['awaiting', 'Link sent', 'p-sent'];
  if (r.status === 'opened') return ['awaiting', 'Link opened', 'p-sent'];
  if (r.status === 'in_progress') return ['progress', 'In progress', 'p-progress'];
  if (r.reviewStatus === 'approved') return ['approved', 'Approved', 'p-approved'];
  if (r.reviewStatus === 'query') return ['query', 'Query raised', 'p-query'];
  return ['review', 'Ready for review', 'p-review'];
}
const pill = r => { const [, l, c] = statusOf(r); return `<span class="pill ${c}">${l}</span>`; };

function flagChips(r) {
  if (r.status !== 'completed') return '<span class="muted">—</span>';
  const f = computeFlags(r);
  if (!f.red.length && !f.amber.length && !f.spoof.length) return `<span class="fl ok">${ICON.flag('#3aa635')} Clear</span>`;
  return `<span class="flags">
    ${f.red.length ? `<span class="fl r" title="Red flags">${ICON.flag('#d6303a')}${f.red.length}</span>` : ''}
    ${f.amber.length ? `<span class="fl a" title="Amber flags">${ICON.flag('#e9a21b')}${f.amber.length}</span>` : ''}
    ${f.spoof.length ? `<span class="fl s" title="Spoof alerts">${ICON.spoof('#6d2fb0')}${f.spoof.length}</span>` : ''}
  </span>`;
}

function assetName(r) { return `${r.asset.make} ${r.asset.model}`.trim(); }
function assetId(r) { return r.asset.reg || r.asset.vin || ''; }
function linkFor(r) {
  return location.protocol === 'file:' ? `${location.href.split('#')[0]}#/i/${r.token}` : `${location.origin}/i/${r.token}`;
}

let VIEW = { name: '', mapObj: null };

function route() {
  if (VIEW.mapObj) { VIEW.mapObj.remove(); VIEW.mapObj = null; }
  const path = location.pathname;
  const h = location.hash.replace(/^#\/?/, '').split('/');
  if (path.startsWith('/i/')) return Inspector.open(path.split('/')[2]);
  if (h[0] === 'i') return Inspector.open(h[1]);
  if (!me()) return renderLogin();
  VIEW.name = h[0] || 'inspections';
  VIEW.arg = h[1];
  if (VIEW.name === 'new') return renderNew();
  if (VIEW.name === 'sent') return renderSent(h[1]);
  if (VIEW.name === 'report') return renderReport(h[1]);
  if (VIEW.name === 'team') return renderTeam();
  if (VIEW.name === 'activity') return renderActivity();
  VIEW.name = 'inspections';
  return renderDashboard();
}
window.addEventListener('hashchange', () => { route(); scrollToY(0); });

// the phone frame scrolls on a laptop; the page scrolls on a real phone
function scrollToY(y) { const p = $('#phone'); if (p) p.scrollTop = y; window.scrollTo(0, y); }
function scrollY0() { const p = $('#phone'); return Math.max(window.scrollY, p ? p.scrollTop : 0); }

// live updates: poll the shared API and refresh the screens that show status
async function poll() {
  if (Inspector.active || !me()) return;
  const before = JSON.parse(JSON.stringify(DB.insp));
  PREV = before;
  const changes = await loadAll();
  if (!changes.length) return;
  changes.forEach(({ before: b, after: a }) => {
    if (!b) return;
    if (b.status !== a.status) {
      const who = a.inspector.name;
      if (a.status === 'opened') toast(`🔗 <b>${esc(who)}</b> opened the link for #${a.id}`);
      if (a.status === 'in_progress' && b.status !== 'in_progress') toast(`📷 <b>${esc(who)}</b> started inspection #${a.id}`);
      if (a.status === 'completed') toast(`✅ Inspection <b>#${a.id}</b> submitted — ready for review`);
    } else if (a.status === 'in_progress' && a.step !== b.step) {
      toast(`📷 #${a.id}: ${esc(a.inspector.name)} is on step ${a.step + 1}`);
    }
  });
  const typing = document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
  if (!typing && ['inspections', 'sent', 'report', 'activity'].includes(VIEW.name)) { const y = scrollY0(); route(); scrollToY(y); }
}
window.addEventListener('storage', e => { if (e.key === LS_KEY) poll(); });

            <div class="fld"><label>Link expires after</label><select class="inp" data-k="due">${[3, 5, 7, 14].map(n => `<option value="${n}" ${+d.due === n ? 'selected' : ''}>${n} days</option>`).join('')}</select></div>
          </div>
        </div>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-outline" id="cancelNew">Cancel</button>
          <button class="btn btn-primary" id="sendNew" style="flex:1;">Create &amp; send link →</button>
        </div>
      </div>
      <div class="side-note">
        <b>How it works</b>
        <ol>
          <li>The inspector gets an SMS / email with a secure link — no app and no login.</li>
          <li>They're guided step by step: location, asset details, VIN, odometer, five condition photos, documents and storage.</li>
          <li>Photos must be taken live; each one is stamped with time and GPS.</li>
          <li>You see their progress live, then get a report with red / amber flags, a location check and spoof alerts.</li>
        </ol>
        <p class="small muted" style="margin-bottom:0;">Requested by <b>${esc(u.name)}</b>. Everyone on the team can see this request.</p>
      </div>
    </div>`);

  document.querySelectorAll('[data-k]').forEach(el => {
    el.oninput = el.onchange = () => {
      d[el.dataset.k] = el.value;
      el.classList.remove('err');
      if (el.dataset.k === 'category') { d.boltOns = []; renderNew(); }
    };
  });
  document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => {
    d.role = b.dataset.role;
    if (d.role === 'Customer' && !d.iname) d.iname = d.customer;
    renderNew();
  });
  document.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => { d[b.dataset.ch] = !d[b.dataset.ch]; renderNew(); });
  document.querySelectorAll('[data-bolt]').forEach(c => c.onchange = () => {
    d.boltOns = c.checked ? [...d.boltOns, c.dataset.bolt] : d.boltOns.filter(k => k !== c.dataset.bolt);
    c.closest('.bolt').classList.toggle('on', c.checked);
  });
  $('#cancelNew').onclick = () => { DRAFT = null; location.hash = '#/inspections'; };
  $('#sendNew').onclick = createRequest;
}

async function geocode(q) {
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 3500);
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ie,gb&q=' + encodeURIComponent(q), { signal: ctl.signal });
    const j = await r.json();
    if (j[0]) return { lat: +j[0].lat, lon: +j[0].lon };
  } catch (e) {}
  return null;
}

async function createRequest() {
  const d = DRAFT, u = me();
  const missing = ['proposalRef', 'customer', 'expectedAddress', 'iname'].filter(k => !String(d[k]).trim());
  if (!d.mobile.trim() && !d.email.trim()) missing.push('mobile', 'email');
  document.querySelectorAll('.inp').forEach(i => i.classList.remove('err'));
  missing.forEach(k => { const el = document.querySelector(`[data-k="${k}"]`); if (el) el.classList.add('err'); });
  if (missing.length) {
    toast('Please fill in the highlighted fields' + (missing.includes('mobile') ? ' — the inspector needs a mobile or email' : ''));
    const first = document.querySelector('.inp.err'); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const btn = $('#sendNew'); btn.disabled = true; btn.textContent = 'Sending…';
  const coords = await geocode(d.expectedAddress) || { lat: 53.3498, lon: -6.2603 };
  const ids = Object.keys(DB.insp).map(Number);
  const id = String(Math.max(14307, ...ids) + 1);
  const via = [d.sms && d.mobile && 'SMS', d.mail && d.email && 'email'].filter(Boolean).join(' and ') || 'link';
  const rec = {
    id, token: rnd(8), proposalRef: d.proposalRef.trim(), customer: d.customer.trim(), category: d.category,
    asset: { make: d.make.trim(), model: d.model.trim(), reg: d.reg.trim().toUpperCase(), vin: d.vin.trim().toUpperCase() },
    expectedAddress: d.expectedAddress.trim(), expectedCoords: coords,
    inspector: { role: d.role, name: d.iname.trim(), mobile: d.mobile.trim(), email: d.email.trim() },
    boltOns: d.boltOns, createdBy: u.id, reviewer: d.reviewer, createdAt: Date.now(), dueAt: Date.now() + d.due * 86400000,
    status: 'sent', answers: {}, photos: {}, comments: [], ips: [],
    events: [{ t: Date.now(), by: u.name, text: `Inspection requested — link sent by ${via} to ${d.iname.trim()}${d.role !== 'Customer' ? ` (${d.role.toLowerCase()})` : ''}` }],
  };
  await saveRec(rec);
  DRAFT = null;
  location.hash = '#/sent/' + id;
}

// =====================================================================
//  Report (the veri.fi-style inspection report)
// =====================================================================
function renderReport(id) {
  const r = DB.insp[id];
  if (!r) { location.hash = '#/inspections'; return; }
  if (r.status !== 'completed') { location.hash = '#/sent/' + id; return; }
  const u = me();
  const F = computeFlags(r);
  const imp = impact(r);
  const site = siteCoords(r);
  const steps = buildSteps(r);
  const a = r.answers;
  const flagColor = F.red.length ? '#d6303a' : F.amber.length ? '#e9a21b' : '#3aa635';
  const pinColor = F.loc.mismatch ? '#d6303a' : '#3aa635';
  const hero = r.photos.photo_front ? photoSrc(r, r.photos.photo_front) : '';
  const driveKm = F.loc.km != null ? F.loc.km * 1.2 : null;
  const canReview = u.role !== 'Requester';
  const decisionCls = r.reviewStatus === 'approved' ? 'd-ok' : r.reviewStatus === 'query' ? 'd-q' : 'd-none';

  const photoCard = (k) => {
    const p = r.photos[k]; if (!p) return '<div class="muted small" style="margin-top:6px;">No photo</div>';
    return `<div class="ph-card" data-zoom="${k}"><img src="${photoSrc(r, p)}" alt=""><div class="st">${ICON.pinO}${fmtStamp(p.t)}</div>${p.live === false ? '<div class="spoof">⚠ Not taken live</div>' : ''}</div>`;
  };
  const ansCls = (f, v) => {
    if (f.check === 'vin' && r.asset.vin && norm(v) !== norm(r.asset.vin)) return 'bad';
    if (f.check === 'reg' && r.asset.reg && norm(v) !== norm(r.asset.reg)) return 'warn';
    if (v === 'Poor' || v === 'Damaged') return 'warn';
    if (f.key === 'vinTamper' && v === 'Yes') return 'bad';
    return '';
  };
  const matchTag = f => {
    const onFile = f.check === 'vin' ? r.asset.vin : f.check === 'reg' ? r.asset.reg : '';
    if (!onFile) return '';
    return norm(a[f.key]) === norm(onFile) ? '<span class="match" style="color:#2a7a26;">✓ matches record</span>' : `<span class="match">✕ on file: ${esc(onFile)}</span>`;
  };
  const sections = steps.filter(s => s.key !== 'site').map(s => {
    const rows = s.fields.filter(f => visible(f, a)).map(f => {
      if (f.type === 'photo') return `<div class="ph">${esc(f.label)}<br>${photoCard(f.key)}</div>`;
      const v = a[f.key] || '—';
      const note = f.note ? f.note(a) : '';
      return `<div class="qa"><span>${esc(f.label)}</span><span class="ans ${ansCls(f, v)}">${esc(f.type === 'date' && v !== '—' ? fmtDate(v) : v)}${matchTag(f)}</span></div>${note ? `<div class="qa-note">${esc(note)}</div>` : ''}`;
    }).join('');
    return `<div class="sec"><div class="sec-t">${esc(s.title)}</div><div class="sec-rows">${rows}</div></div>`;
  }).join('');

  const notChosen = BOLTONS.filter(b => b.kinds.includes(CATS[r.category].kind) && !(r.boltOns || []).includes(b.key));
  const flagList = (arr, empty) => arr.length ? arr.map(x => `<div>${esc(x)}</div>`).join('') : `<div class="muted">${empty}</div>`;

  shell(`
  <div class="rep">
    <div class="rep-actions">
      <a href="#/inspections" class="btn btn-outline btn-sm">← Back</a>
      <span class="sp"></span>
      <button class="btn btn-outline btn-sm" id="copyRep">Copy link</button>
      <button class="btn btn-navy btn-sm" id="pdf">PDF</button>

      ${imp ? `<div class="impact-box"><div class="impact-ico">${ICON.leafbox}</div><div><b>Positive Impact:</b><ul>
        <li><span class="leaf"></span>≡ ${imp.trees.toFixed(1)} trees' annual CO₂ uptake</li>
        <li><span class="leaf"></span>~${Math.round(imp.co2)} kg CO₂ saved</li>
        <li><span class="leaf"></span>${imp.hours.toFixed(1)} work hours saved</li></ul></div></div>` : ''}

        <div class="qstatus">Quick Status<span class="ic"><span title="${F.red.length ? 'Red flags' : F.amber.length ? 'Amber flags' : 'No flags'}">${ICON.flag(flagColor)}</span><span title="${F.loc.mismatch ? 'Location mismatch' : 'Location OK'}">${ICON.pin(pinColor)}</span></span></div>
      </div>

      <div class="ar">${ICON.pin('#d6303a')}<span>Inspection was performed at <b>location</b> (${F.loc.km.toFixed(2)} km away (*straight-line distance) from the address input by the inspector).</span></div>`

      <div class="ar">${ICON.chev}<span>Further enquiries should be made.</span></div>

    <div class="refbar">Proposal Number/Ref: ${esc(r.proposalRef)}</div>
    <div class="flagmap">
      <div class="flagcol">
        <div class="flagcard" data-fl="red">${ICON.flag('#d6303a')}<b>${F.red.length}</b>Red flags</div>

      <div class="mapwrap">

        ${r.gps && site ? `<div class="maplegend"><div class="ea"><span class="mk mk-e">E</span><span class="mk-line"></span><span class="mk mk-a">A</span></div>
          <b>Expected Location → Actual Inspection Location</b><br>${F.loc.km.toFixed(2)} km apart<br><span class="muted">Driving: ≈ ${driveKm.toFixed(1)} km / ${Math.max(1, Math.round(driveKm / 0.75))} mins</span></div>` : ''}

    <div class="page-break"></div>

    ${sections}

    ${notChosen.length ? `<div class="rblock"><h3 style="color:var(--text);">Further bolt-ons available for ${CATS[r.category].label} inspections</h3>

      <h3 style="margin-top:6px;">Team comments</h3>
      ${(r.comments || []).map(c => { const cu = userById(c.by); return `<div class="comment">${avatar(cu)}<div class="cb"><b>${esc(cu.name)}</b> <small>${esc(cu.role)} · ${fmtAgo(c.t)}</small><div>${esc(c.text)}</div></div></div>`; }).join('') || '<p class="small muted">No comments yet.</p>'}
      <div class="no-print" style="display:flex;gap:8px;margin-top:8px;">
        <input class="inp" id="cmt" placeholder="Add a comment for the team… (e.g. @Conor can you check the VIN?)">
        <button class="btn btn-navy btn-sm" id="cmtBtn">Post</button>
      </div>
    </div>

    <div class="rblock">
      <h3 style="color:var(--text);">Audit trail</h3>
      <ul class="audit" style="padding-left:18px;margin:0;">${(r.events || []).slice().sort((x, y) => x.t - y.t).map(e => `<li><b>${fmtStamp(e.t)}</b> — ${esc(e.by === 'Inspector' ? r.inspector.name + ' (inspector)' : e.by)}: ${esc(e.text)}</li>`).join('')}</ul>
    </div>
  </div>`);

  // map
  if (r.gps && window.L) {
    const m = L.map('map', { zoomControl: true, scrollWheelZoom: false, attributionControl: true });
    VIEW.mapObj = m;
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(m);
    const icon = (cls, t) => L.divIcon({ className: '', html: `<div class="mk ${cls}">${t}</div>`, iconSize: [24, 24], iconAnchor: [12, 12] });
    const A = [r.gps.lat, r.gps.lon];
    L.marker(A, { icon: icon('mk-a', 'A') }).addTo(m).bindTooltip('Actual inspection location');
    if (site && F.loc.km > 0.05) {
      const E = [site.lat, site.lon];
      L.marker(E, { icon: icon('mk-e', 'E') }).addTo(m).bindTooltip('Expected location (address entered)');
      L.polyline([E, A], { color: '#7a8796', weight: 3, dashArray: '6 6' }).addTo(m);
      m.fitBounds([E, A], { paddingTopLeft: [40, 40], paddingBottomRight: [40, 130] });
    } else { m.setView(A, 15); L.circle(A, { radius: r.gps.acc || 20, color: '#3aa635' }).addTo(m); }
  } else if (!r.gps) {
    $('#map').innerHTML = '<div class="empty">No location was shared by the inspector\'s device.</div>';
  }

  document.querySelectorAll('[data-fl]').forEach(c => c.onclick = () => {
    const k = c.dataset.fl;
    $('#flagDetail').innerHTML = flagList(F[k], `No ${k === 'spoof' ? 'spoof alerts' : k + ' flags'}.`);
  });
  document.querySelectorAll('[data-zoom]').forEach(c => c.onclick = () => {
    const lb = document.createElement('div'); lb.className = 'lightbox';
    lb.innerHTML = `<img src="${photoSrc(r, r.photos[c.dataset.zoom])}">`; lb.onclick = () => lb.remove();
    document.body.appendChild(lb);
  });
  $('#pdf').onclick = () => window.print();
  $('#copyRep').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(location.href); toast('Report link copied — colleagues sign in to view it'); };
  const post = async () => {
    const text = $('#cmt').value.trim(); if (!text) return;
    await mutate(r.id, x => { x.comments = x.comments || []; x.comments.push({ by: u.id, t: Date.now(), text }); x.events.push({ t: Date.now(), by: u.name, text: 'Added a comment' }); });
    route(); setTimeout(() => $('#review').scrollIntoView({ block: 'center' }), 50);
  };
  $('#cmtBtn').onclick = post;
  $('#cmt').onkeydown = e => { if (e.key === 'Enter') post(); };
  if ($('#approve')) $('#approve').onclick = async () => {
    await mutate(r.id, x => { x.reviewStatus = 'approved'; x.reviewedBy = u.id; x.reviewedAt = Date.now(); x.events.push({ t: Date.now(), by: u.name, text: 'Approved the inspection' }); });
    toast('Inspection approved'); route();
  };
  if ($('#query')) $('#query').onclick = () => {
    $('#queryBox').innerHTML = `<div class="fld" style="margin-bottom:16px;"><label>What needs following up?</label><textarea class="inp" id="qReason" rows="3" placeholder="e.g. Location doesn't match the business address — please confirm with the customer"></textarea>
      <div style="margin-top:8px;display:flex;gap:8px;"><button class="btn btn-primary btn-sm" id="qSend">Raise query</button><button class="btn btn-outline btn-sm" id="qCancel">Cancel</button></div></div>`;
    $('#qReason').focus();
    $('#qCancel').onclick = () => { $('#queryBox').innerHTML = ''; };
    $('#qSend').onclick = async () => {
      const reason = $('#qReason').value.trim() || 'Needs follow-up';
      await mutate(r.id, x => { x.reviewStatus = 'query'; x.queryReason = reason; x.reviewedBy = u.id; x.reviewedAt = Date.now(); x.comments = x.comments || []; x.comments.push({ by: u.id, t: Date.now(), text: reason }); x.events.push({ t: Date.now(), by: u.name, text: 'Raised a query' }); });
      route();
    };
  };
  if ($('#reinspect')) $('#reinspect').onclick = async () => {
    if (!confirm(`Send ${r.inspector.name} a new link to redo this inspection? The current answers are kept in the audit trail.`)) return;
    await mutate(r.id, x => {
      x.history = x.history || []; x.history.push({ answers: x.answers, completedAt: x.completedAt, gps: x.gps });
      Object.assign(x, { status: 'sent', token: rnd(8), answers: {}, photos: {}, gps: null, siteCoords: null, step: 0, startedAt: null, completedAt: null, reviewStatus: null, dueAt: Date.now() + 5 * 86400000 });
      x.events.push({ t: Date.now(), by: u.name, text: `Requested a re-inspection — new link sent to ${x.inspector.name}` });
    });
    location.hash = '#/sent/' + r.id;
  };
}

  const recs = Object.values(DB.insp);
  shell(`
    <div class="pagehead"><div><h1>Team</h1><p class="sub">Everyone works from the same inspections, each with their own login and role.</p></div></div>
    ${DB.team.map(t => `<div class="ucard">${avatar(t, 38)}
      <div class="uinfo"><b>${esc(t.name)}</b>${t.id === u.id ? ' <span class="muted small">(you)</span>' : ''}<small>${esc(t.title)}</small><small>${esc(t.email)}</small>
        <div class="umeta">
          ${isAdmin && t.id !== u.id ? `<select class="inp" data-role-of="${t.id}" style="padding:5px 8px;width:auto;font-size:13px;">${Object.keys(ROLES).map(r => `<option ${t.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select>` : `<span class="rolepill">${esc(t.role)}</span>`}
          <span>${recs.filter(r => r.createdBy === t.id).length} requested</span>

        </div></div></div>`).join('')}
    <div class="card" style="margin:14px 0;">
      <h3>Invite a colleague</h3>
      ${isAdmin ? `
        <div class="fld" style="margin-bottom:10px;"><label>Name</label><input class="inp" id="nvName"></div>
        <div class="fld" style="margin-bottom:10px;"><label>Email</label><input class="inp" id="nvEmail" placeholder="name@capitalflow.ie" inputmode="email"></div>
        <div class="fld" style="margin-bottom:10px;"><label>Job title</label><input class="inp" id="nvTitle" placeholder="e.g. Credit Analyst"></div>
        <div class="fld" style="margin-bottom:14px;"><label>Role</label><select class="inp" id="nvRole">${Object.keys(ROLES).map(r => `<option ${r === 'Reviewer' ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
        <button class="btn btn-primary btn-block" id="nvBtn">Send invite</button>
        <p class="small muted" style="margin:10px 0 0;">They get an email to set a password. Brokers and partners can be added as Requesters.</p>`
        : `<p class="small muted" style="margin:0;">Only Admins can invite colleagues. Switch to <b>Aoife Byrne</b> from your avatar menu to try it.</p>`}
    </div>
    <h3>Roles</h3>
    <div class="roles">${Object.entries(ROLES).map(([k, v]) => `<div class="role-card"><b>${k}</b>${v}</div>`).join('')}</div>`);

  if (!isAdmin) return;
  document.querySelectorAll('[data-role-of]').forEach(s => s.onchange = async () => {
    userById(s.dataset.roleOf).role = s.value; await saveTeam(); toast('Role updated');
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    const t = userById(b.dataset.rm);
    if (!confirm(`Remove ${t.name}? Their inspections stay on the list.`)) return;
